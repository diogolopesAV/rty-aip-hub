name: rty-aip-hub
version: 1.0.0
description: Riverty AI Package Hub — curated skills and AI capabilities for the Riverty
  platform
license: MIT
targets:
  - claude
  - cursor
  - codex
  - copilot
marketplace:
  name: rty-hub
  owner:
    name: Riverty Technology Innovation
    url: https://github.com/Riverty-Tech-Innovation
  outputs:
    claude: {}
    codex: {}
  packages:
    - name: rty-sample-skills-only
      source: ./plugins/rty-sample-skills-only
      category: Developer Tools
      description: Sample plugin with a single skill and no other primitives
      tags:
        - skill
        - sample
    - name: rty-sample-hooks
      source: ./plugins/rty-sample-hooks
      category: Developer Tools
      description: Sample plugin with a skill plus lifecycle hooks
      tags:
        - skill
        - hook
        - sample
    - name: rty-sample-integration
      source: ./plugins/rty-sample-integration
      category: Developer Tools
      description: Sample plugin with a skill, an MCP server, and an agent
      tags:
        - skill
        - mcp
        - agent
        - sample
    - name: rty-sample-governed
      source: ./plugins/rty-sample-governed
      category: Developer Tools
      description: Sample plugin with a multi-file skill plus Cursor rules
      tags:
        - skill
        - rules
        - sample
    - name: rty-devops-toolkit
      source: ./plugins/rty-devops-toolkit
      category: Developer Tools
      description: DevOps automation toolkit — deploy workflows, database migrations,
        secrets scanning, infrastructure auditing, and incident response
      tags:
        - devops
        - deploy
        - database
        - security
        - incident-response
        - infrastructure
    - name: rty-test-plugin
      source: diogolopesAV/rty-test-plugin
      ref: 93826905c974d0ea45f938d500e8a1994630048f
      category: Developer Tools
      description: Reference plugin demonstrating all supported plugin primitives
        (skills, hooks, MCP, rules)
      tags:
        - skill
        - test
        - hooks
        - mcp
    - name: modernuo-plugin
      source: RebirthUO/plugin
      subdir: plugins/modernuo
      ref: 4d471624f81e9b6bcb33809b2dd7dda940e959c2
      category: Developer Tools
      description: ModernUO plugin fetched from a remote repository's subdirectory
      tags:
        - modernuo
        - plugin
    - name: rty-test-design-plugin
      source: ./plugins/rty-test-design-plugin
      category: Frontend
      description: 'plugin for testing the Pull Request from Diogo''s implementation
        . Currently testing: new plugin into rty-hub main'
      tags:
        - automation
dependencies:
  apm:
    - diogolopesAV/rty-aip-hub/plugins/rty-sample-skills-only
    - diogolopesAV/rty-aip-hub/plugins/rty-sample-hooks
    - diogolopesAV/rty-aip-hub/plugins/rty-sample-integration
    - diogolopesAV/rty-aip-hub/plugins/rty-sample-governed
    - diogolopesAV/rty-aip-hub/plugins/rty-devops-toolkit
    - diogolopesAV/rty-test-plugin#93826905c974d0ea45f938d500e8a1994630048f
    - RebirthUO/plugin/plugins/modernuo#4d471624f81e9b6bcb33809b2dd7dda940e959c2
    - diogolopesAV/rty-aip-hub/plugins/rty-test-design-plugin
